# 数値計算の検証、ビルド、ブラウザでの検証、公開（docs/plan.md §5、§6）。
# 外部の Action はコミット SHA で固定し、横にバージョンを書く。更新は Dependabot が PR を作る。
name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Check workflow hardening
        run: npm run check:workflows
      - name: Check image metadata
        run: npm run check:images
      - name: Type check
        run: npm run lint
      - name: Install Rust (version pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Rust format and lint
        run: cargo fmt --check && cargo clippy --release -p sim --all-targets -- -D warnings && cargo clippy --release -p sim --target wasm32-unknown-unknown -- -D warnings
      - name: Numerical verification (V-01〜V-05)
        run: cargo test --release

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Rust (version pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build (WebAssembly and page)
        run: npm run build
      - name: Asset budget (Q-05)
        run: npm run check:budget
      - name: Install browser for E2E
        run: npx playwright install --with-deps chromium
      - name: Browser tests (V-06, V-07)
        run: npm run test:e2e
      - name: Lighthouse (Q-01)
        run: npm run test:lighthouse
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
